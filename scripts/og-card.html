<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CurrentJabe social preview</title>
    <style>
      @font-face {
        font-family: Satoshi;
        src: url("__SATOSHI_REGULAR__") format("woff2");
        font-style: normal;
        font-weight: 400;
      }

      @font-face {
        font-family: Satoshi;
        src: url("__SATOSHI_MEDIUM__") format("woff2");
        font-style: normal;
        font-weight: 500;
      }

      @font-face {
        font-family: Satoshi;
        src: url("__SATOSHI_BOLD__") format("woff2");
        font-style: normal;
        font-weight: 700;
      }

      :root {
        --paper: #f4efe6;
        --paper-bright: #fffaf2;
        --ink: #171714;
        --ink-soft: #656158;
        --red: #e34232;
        --black: #0e0e0c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100vw;
        height: 538px;
        margin: 0;
        overflow: hidden;
        background: var(--black);
      }

      body {
        color: var(--ink);
        font-family: Satoshi, sans-serif;
      }

      .card {
        position: relative;
        width: 100vw;
        height: 538px;
        overflow: hidden;
        border: 30px solid var(--black);
        outline: 1px solid rgba(255, 250, 242, 0.22);
        outline-offset: -31px;
        background:
          radial-gradient(circle at 8% 8%, rgba(255, 255, 255, 0.88), transparent 220px),
          var(--paper);
      }

      .copy {
        position: absolute;
        inset: 0 390px 0 0;
        padding: 46px 56px 48px;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.045em;
      }

      .wordmark img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .wordmark em {
        color: var(--red);
        font-style: normal;
      }

      .eyebrow {
        margin-top: 64px;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        width: 590px;
        margin: 13px 0 0;
        font-size: 66px;
        font-weight: 500;
        letter-spacing: -0.064em;
        line-height: 0.9;
      }

      h1 span {
        color: var(--red);
      }

      .description {
        width: 470px;
        margin: 21px 0 0;
        color: var(--ink-soft);
        font-size: 17px;
        line-height: 1.35;
      }

      .utility-line {
        position: absolute;
        right: 56px;
        bottom: 47px;
        left: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: rgba(23, 23, 20, 0.57);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .utility-line strong {
        color: var(--red);
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      .map-panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 390px;
        overflow: hidden;
        color: var(--paper-bright);
        background:
          radial-gradient(circle at 50% 49%, rgba(227, 66, 50, 0.25), transparent 47%),
          radial-gradient(circle, rgba(255, 250, 242, 0.1) 0 1px, transparent 1.25px) 0 0 / 10px 10px,
          var(--black);
      }

      .map-panel::before {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 1px;
        background: rgba(23, 23, 20, 0.28);
        content: "";
      }

      .map-label {
        position: absolute;
        z-index: 2;
        top: 45px;
        left: 34px;
        color: rgba(255, 250, 242, 0.6);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .map {
        position: absolute;
        top: 47px;
        left: 51px;
        width: 288px;
        height: 384px;
        overflow: visible;
        filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.34));
      }

      .map path {
        fill: rgba(255, 250, 242, 0.17);
        stroke: rgba(255, 250, 242, 0.36);
        stroke-width: 0.7;
        vector-effect: non-scaling-stroke;
      }

      .map-meta {
        position: absolute;
        right: 34px;
        bottom: 43px;
        left: 34px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      .map-meta strong {
        color: var(--red);
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 0.84;
      }

      .map-meta span {
        width: 128px;
        color: rgba(255, 250, 242, 0.62);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.11em;
        line-height: 1.45;
        text-align: right;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="copy">
        <div class="wordmark">
          <img alt="" src="__CURRENTJABE_MARK__" />
          <div>Current<em>Jabe</em></div>
        </div>
        <div class="eyebrow">Bangladesh community outage map</div>
        <h1>Current <span>Jabe</span><br />Kokhon?</h1>
        <p class="description">Check live community reports and likely power-cut windows for your area.</p>
        <div class="utility-line">
          <span>Live status&nbsp; / &nbsp;Outage history&nbsp; / &nbsp;Community prediction</span>
          <strong>Free · Anonymous</strong>
        </div>
      </section>

      <aside class="map-panel" aria-label="Bangladesh map">
        <div class="map-label">Community map (live)</div>
        <svg class="map" viewBox="0 0 720 960" aria-hidden="true">
          <!-- MAP_PATHS -->
        </svg>
        <div class="map-meta">
          <strong>64</strong>
          <span>districts · nationwide</span>
        </div>
      </aside>
    </main>
  </body>
</html>
